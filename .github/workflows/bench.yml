# Benchmark copy of WordPress/gutenberg's end2end-test.yml: the build job, the 8 Playwright parts,
# RTC WebSocket and Site Editor v2, as upstream runs them. Left out on every runner: the
# change-detection gate, the repository guard on the build (it only builds in WordPress/gutenberg)
# and the artifact merge and report jobs. Same steps and commit on every runner; only the test
# steps differ. wp-env-instances.sh starts one WordPress per two cores and the config runs one
# worker per site, so the parts use 16 vCPU when given it. The rival test steps add
# --reporter=list,json to upstream's npm script.
name: bench
on:
    workflow_dispatch:
        inputs:
            runner:
                type: choice
                options: [boba-turbo, boba-standard, github-16, blacksmith-16, github-4, blacksmith-4]
permissions:
    contents: read
    checks: write
    pull-requests: write
    actions: read
    id-token: write

jobs:
    build:
        name: Build (${{ inputs.runner }})
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-24.04' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
        permissions:
            contents: read
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build

            # Wider than the `build*` directories, because the build also emits
            # generated files next to sources: the block parsers, the icon
            # library, and the worker entry points.
            - name: Upload build output
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-output
                  path: |
                      build
                      packages/*/build
                      packages/*/build-module
                      packages/*/build-style
                      packages/*/build-types
                      packages/*/build-wp
                      packages/*/src/library/*.tsx
                      packages/*/src/library/index.ts
                      packages/*/src/worker-code.ts
                      packages/block-serialization-spec-parser/parser.js
                      packages/block-serialization-spec-parser/parser.php
                  retention-days: 3
                  if-no-files-found: error
                  # Allow re-running the workflow over a previous attempt.
                  overwrite: true

    e2e-playwright:
        name: Playwright - ${{ matrix.part }} (${{ inputs.runner }})
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-24.04' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
        needs: build
        timeout-minutes: 45
        # A skipped check counts as passing for required status checks, so a
        # broken build must not skip these jobs — they have to start and go red
        # (see the guard step below). `!cancelled()` is what drops the implicit
        # `success()`; `!= 'skipped'` keeps the fork/repository filter that now
        # lives on the build job.
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                part: [1, 2, 3, 4, 5, 6, 7, 8]
                totalParts: [8]

        steps:
            # Bail out before checkout and `npm ci` rather than after.
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: build-output

            - name: Install Playwright dependencies
              uses: ./.github/setup-playwright
              with:
                  workspace: '@wordpress/e2e-tests-playwright'
                  browsers: chromium firefox webkit

            - name: Install WordPress and start one server per two cores
              run: |
                  urls=$( test/e2e/wp-env-instances.sh )
                  echo "WP_BASE_URLS=$urls" >> "$GITHUB_ENV"

            - name: Run the tests on Boba
              if: startsWith(inputs.runner, 'boba')
              uses: coldteadotai/boba@v1
              with:
                  working-directory: test/e2e
                  config: test/e2e/playwright.config.ts
                  playwright-args: --shard=${{ matrix.part }}/${{ matrix.totalParts }} --fully-parallel
                  turbo: ${{ inputs.runner == 'boba-turbo' }}
                  fail-fast: false
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

            - name: Run the tests
              if: ${{ !startsWith(inputs.runner, 'boba') }}
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/results.json
              run: |
                  npm run --workspace @wordpress/e2e-tests-playwright test:e2e -- --shard=${{ matrix.part }}/${{ matrix.totalParts }} --fully-parallel --reporter=list,json

            - name: Upload JSON results
              if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: results-${{ inputs.runner }}-${{ matrix.part }}
                  path: results.json
                  retention-days: 30

            - name: Archive blob reports (HTML)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: blob-reports--${{ matrix.part }}
                  path: test/e2e/blob-report
                  if-no-files-found: ignore

            - name: Archive flaky tests report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: flaky-tests-report--${{ matrix.part }}
                  path: test/e2e/flaky-tests
                  if-no-files-found: ignore

    e2e-playwright-rtc-websocket:
        name: Playwright - RTC WebSocket (${{ inputs.runner }})
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-24.04' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
        needs: build
        timeout-minutes: 20
        # A skipped check counts as passing for required status checks, so a
        # broken build must not skip these jobs — they have to start and go red
        # (see the guard step below). `!cancelled()` is what drops the implicit
        # `success()`; `!= 'skipped'` keeps the fork/repository filter that now
        # lives on the build job.
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read
            id-token: write

        steps:
            # Bail out before checkout and `npm ci` rather than after.
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: build-output

            # No collaboration spec is tagged `@webkit` or `@firefox`.
            - name: Install Playwright dependencies
              uses: ./.github/setup-playwright
              with:
                  workspace: '@wordpress/e2e-tests-playwright'
                  browsers: chromium

            - name: Install WordPress and start the server
              run: |
                  npm run wp-env-test start

            - name: Run the tests on Boba
              if: startsWith(inputs.runner, 'boba')
              uses: coldteadotai/boba@v1
              with:
                  working-directory: test/e2e
                  config: test/e2e/playwright.rtc-websocket.config.ts
                  turbo: ${{ inputs.runner == 'boba-turbo' }}
                  fail-fast: false
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  # Run against the "slow" profile (a short simulated send
                  # delay) for better coverage of real-world timing.
                  RTC_WS_DELAY: 50
                  # Label flaky reports so this job's diagnostics don't collide
                  # with the default suite's when artifacts are merged, and so
                  # WebSocket-provider flakes are reported as their own issues.
                  FLAKY_TESTS_REPORT_LABEL: 'RTC WebSocket'

            - name: Run the tests
              if: ${{ !startsWith(inputs.runner, 'boba') }}
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  # Run against the "slow" profile (a short simulated send
                  # delay) for better coverage of real-world timing.
                  RTC_WS_DELAY: 50
                  # Label flaky reports so this job's diagnostics don't collide
                  # with the default suite's when artifacts are merged, and so
                  # WebSocket-provider flakes are reported as their own issues.
                  FLAKY_TESTS_REPORT_LABEL: 'RTC WebSocket'
                  PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/results.json
              run: |
                  npm run --workspace @wordpress/e2e-tests-playwright test:e2e:rtc-websocket --reporter=list,json

            - name: Upload JSON results
              if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: results-${{ inputs.runner }}-rtc-websocket
                  path: results.json
                  retention-days: 30

            - name: Archive blob reports (HTML)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: blob-reports--rtc-websocket
                  path: test/e2e/blob-report
                  if-no-files-found: ignore

            - name: Archive flaky tests report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: flaky-tests-report--rtc-websocket
                  path: test/e2e/flaky-tests
                  if-no-files-found: ignore

    e2e-playwright-site-editor-v2:
        name: Playwright - Site Editor v2 (${{ inputs.runner }})
        runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-16' && 'bench-16' || inputs.runner == 'github-4' && 'ubuntu-24.04' || inputs.runner == 'blacksmith-4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
        needs: build
        timeout-minutes: 45
        # A skipped check counts as passing for required status checks, so a
        # broken build must not skip these jobs — they have to start and go red
        # (see the guard step below). `!cancelled()` is what drops the implicit
        # `success()`; `!= 'skipped'` keeps the fork/repository filter that now
        # lives on the build job.
        if: ${{ !cancelled() && needs.build.result != 'skipped' }}
        permissions:
            contents: read
            id-token: write

        steps:
            # Bail out before checkout and `npm ci` rather than after.
            - name: Fail if the build job failed
              if: ${{ needs.build.result != 'success' }}
              run: exit 1

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: build-output

            # The site editor v2 config only defines a chromium project.
            - name: Install Playwright dependencies
              uses: ./.github/setup-playwright
              with:
                  workspace: '@wordpress/e2e-tests-playwright'
                  browsers: chromium

            - name: Install WordPress and start the server
              run: |
                  npm run wp-env-test start

            - name: Run the tests on Boba
              if: startsWith(inputs.runner, 'boba')
              uses: coldteadotai/boba@v1
              with:
                  working-directory: test/e2e
                  config: test/e2e/playwright.site-editor-v2.config.ts
                  turbo: ${{ inputs.runner == 'boba-turbo' }}
                  fail-fast: false
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  # Label flaky reports so this job's diagnostics don't collide
                  # with the default suite's when artifacts are merged, and so
                  # extensible-site-editor flakes are reported as their own
                  # issues.
                  FLAKY_TESTS_REPORT_LABEL: 'Site Editor v2'

            - name: Run the tests
              if: ${{ !startsWith(inputs.runner, 'boba') }}
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
                  # Label flaky reports so this job's diagnostics don't collide
                  # with the default suite's when artifacts are merged, and so
                  # extensible-site-editor flakes are reported as their own
                  # issues.
                  FLAKY_TESTS_REPORT_LABEL: 'Site Editor v2'
                  PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/results.json
              run: |
                  npm run --workspace @wordpress/e2e-tests-playwright test:e2e:site-editor-v2 --reporter=list,json

            - name: Upload JSON results
              if: ${{ always() && !startsWith(inputs.runner, 'boba') }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: results-${{ inputs.runner }}-site-editor-v2
                  path: results.json
                  retention-days: 30

            - name: Archive blob reports (HTML)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: blob-reports--site-editor-v2
                  path: test/e2e/blob-report
                  if-no-files-found: ignore

            - name: Archive flaky tests report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: flaky-tests-report--site-editor-v2
                  path: test/e2e/flaky-tests
                  if-no-files-found: ignore
